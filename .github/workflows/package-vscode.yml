name: Package PLINJS VS Code Extension

on:
  push:
    paths:
      - "plinjs-vscode/**"
      - ".github/workflows/package-vscode.yml"

  workflow_dispatch:

jobs:
  package:
    name: Build VSIX
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: plinjs-vscode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Package PLINJS VS Code extension
        run: npx @vscode/vsce package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: plinjs-vscode-extension
          path: plinjs-vscode/*.vsix
          if-no-files-found: error
          retention-days: 30