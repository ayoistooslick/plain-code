name: Build Acode Plugin

on:
  push:
    branches:
      - main
    paths:
      - "plainscript-acode/**"
      - ".github/workflows/build.yml"

  pull_request:
    paths:
      - "plainscript-acode/**"
      - ".github/workflows/build.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Acode Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run PlainScript tests
        run: npm test

      - name: Verify Acode plugin files
        run: |
          test -f plainscript-acode/plugin.json
          test -f plainscript-acode/main.js

          echo "Acode plugin files:"
          ls -lah plainscript-acode

      - name: Package Acode plugin
        run: |
          mkdir -p dist

          cd plainscript-acode
          zip -r ../dist/plainscript-acode-plugin.zip . \
            -x "*.git*" \
            -x "node_modules/*"

      - name: Verify plugin ZIP
        run: |
          echo "Plugin package:"
          ls -lh dist/plainscript-acode-plugin.zip

          echo
          echo "ZIP contents:"
          unzip -l dist/plainscript-acode-plugin.zip

      - name: Upload Acode plugin
        uses: actions/upload-artifact@v4
        with:
          name: plainscript-acode-plugin
          path: dist/plainscript-acode-plugin.zip
          if-no-files-found: error