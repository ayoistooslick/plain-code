<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlainScript WebSocket Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; height: 100vh; display: flex; }
    .sidebar { width: 280px; background: #fff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header h2 { font-size: 16px; color: #333; }
    .room-list { flex: 1; overflow-y: auto; padding: 8px; }
    .room-item { padding: 12px; cursor: pointer; border-radius: 8px; transition: background 0.2s; display: flex; justify-content: space-between; align-items: center; }
    .room-item:hover { background: #f0f0f0; }
    .room-item.active { background: #e3f2fd; }
    .room-name { font-weight: 500; color: #333; }
    .room-count { font-size: 12px; color: #888; background: #eee; padding: 2px 8px; border-radius: 10px; }
    .user-list { padding: 16px; border-top: 1px solid #e0e0e0; }
    .user-list h4 { font-size: 12px; color: #888; margin-bottom: 8px; text-transform: uppercase; }
    .user-item { padding: 8px; font-size: 14px; color: #555; display: flex; align-items: center; gap: 8px; }
    .user-item::before { content: ''; width: 8px; height: 8px; background: #4caf50; border-radius: 50%; }
    .main { flex: 1; display: flex; flex-direction: column; background: #fff; }
    .chat-header { padding: 16px 24px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
    .chat-header h1 { font-size: 18px; color: #333; }
    .chat-header .room-info { display: flex; align-items: center; gap: 12px; }
    .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 70%; animation: fadeIn 0.3s ease; }
    .message.own { align-self: flex-end; }
    .message.system { align-self: center; max-width: 100%; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .message-sender { font-weight: 600; font-size: 14px; color: #333; }
    .message-time { font-size: 11px; color: #999; }
    .message.system .message-sender { color: #666; font-style: italic; }
    .message-content { padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.5; }
    .message.own .message-content { background: #1976d2; color: #fff; border-bottom-right-radius: 4px; }
    .message:not(.own) .message-content { background: #f0f0f0; color: #333; border-bottom-left-radius: 4px; }
    .message.system .message-content { background: transparent; color: #888; font-size: 13px; padding: 4px 12px; }
    .input-area { padding: 16px 24px; border-top: 1px solid #e0e0e0; background: #fafafa; }
    .input-row { display: flex; gap: 12px; }
    .input-row input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 24px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .input-row input:focus { border-color: #1976d2; }
    .input-row button { padding: 12px 24px; background: #1976d2; color: #fff; border: none; border-radius: 24px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    .input-row button:hover { background: #1565c0; }
    .join-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .join-modal.hidden { display: none; }
    .join-box { background: #fff; padding: 32px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
    .join-box h2 { margin-bottom: 24px; color: #333; text-align: center; }
    .join-box .form-group { margin-bottom: 16px; }
    .join-box label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; }
    .join-box input, .join-box select { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    .join-box input:focus, .join-box select:focus { border-color: #1976d2; }
    .join-box button { width: 100%; padding: 14px; background: #1976d2; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 8px; }
    .join-box button:hover { background: #1565c0; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #666; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; }
    .status-dot.disconnected { background: #f44336; }
  </style>
</head>
<body>
  <div class="join-modal" id="joinModal">
    <div class="join-box">
      <h2>Join Chat</h2>
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="nameInput" placeholder="Enter your name" maxlength="30">
      </div>
      <div class="form-group">
        <label>Room</label>
        <select id="roomSelect">
          <option value="general">general</option>
        </select>
      </div>
      <button id="joinBtn">Join Chat</button>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Rooms</h2>
    </div>
    <div class="room-list" id="roomList"></div>
    <div class="user-list">
      <h4>Users in Room</h4>
      <div id="userList"></div>
    </div>
  </div>

  <div class="main">
    <div class="chat-header">
      <h1 id="currentRoom">general</h1>
      <div class="room-info">
        <div class="status">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Connecting...</span>
        </div>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div class="input-row">
        <input type="text" id="messageInput" placeholder="Type a message..." disabled>
        <button id="sendBtn" disabled>Send</button>
      </div>
    </div>
  </div>

  <script>
    const wsUrl = 'ws://' + location.host.replace(/:\d+$/, '') + ':3001';
    let ws = null;
    let userId = null;
    let currentRoom = 'general';
    let userName = '';
    let rooms = [];

    const joinModal = document.getElementById('joinModal');
    const nameInput = document.getElementById('nameInput');
    const roomSelect = document.getElementById('roomSelect');
    const joinBtn = document.getElementById('joinBtn');
    const roomList = document.getElementById('roomList');
    const userList = document.getElementById('userList');
    const messages = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const currentRoomEl = document.getElementById('currentRoom');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    function connect() {
      ws = new WebSocket(wsUrl);
      
      ws.onopen = () => {
        updateStatus(true);
        send({ action: 'get-rooms' });
      };
      
      ws.onclose = () => {
        updateStatus(false);
        setTimeout(connect, 3000);
      };
      
      ws.onerror = (err) => {
        console.error('WebSocket error:', err);
      };
      
      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          handleMessage(msg);
        } catch (e) {
          console.error('Parse error:', e);
        }
      };
    }

    function updateStatus(connected) {
      statusDot.classList.toggle('disconnected', !connected);
      statusText.textContent = connected ? 'Connected' : 'Disconnected';
      messageInput.disabled = !connected;
      sendBtn.disabled = !connected;
    }

    function send(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(data));
      }
    }

    function handleMessage(msg) {
      // Filter messages by current room (server broadcasts to all)
      if (msg.room && msg.room !== currentRoom && msg.type !== 'welcome' && msg.type !== 'rooms' && msg.type !== 'room-switched') {
        return;
      }

      switch (msg.type) {
        case 'welcome':
          userId = msg.userId;
          userName = msg.name;
          currentRoom = msg.room;
          currentRoomEl.textContent = msg.room;
          renderUsers(msg.users);
          joinModal.classList.add('hidden');
          break;
        case 'message':
          addMessage(msg.from, msg.content, msg.timestamp, msg.userId === userId);
          break;
        case 'system':
          addSystemMessage(msg.content);
          if (msg.users) renderUsers(msg.users);
          break;
        case 'room-switched':
          currentRoom = msg.room;
          currentRoomEl.textContent = msg.room;
          renderUsers(msg.users);
          break;
        case 'rooms':
          rooms = msg.rooms;
          renderRooms();
          break;
        case 'users':
          renderUsers(msg.users);
          break;
      }
    }

    function addMessage(sender, content, timestamp, isOwn) {
      const div = document.createElement('div');
      div.className = 'message' + (isOwn ? ' own' : '');
      const time = new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      div.innerHTML = `
        <div class="message-header">
          <span class="message-sender">${escapeHtml(sender)}</span>
          <span class="message-time">${time}</span>
        </div>
        <div class="message-content">${escapeHtml(content)}</div>
      `;
      messages.appendChild(div);
      scrollToBottom();
    }

    function addSystemMessage(content) {
      const div = document.createElement('div');
      div.className = 'message system';
      div.innerHTML = `<div class="message-content">${escapeHtml(content)}</div>`;
      messages.appendChild(div);
      scrollToBottom();
    }

    function renderRooms() {
      roomList.innerHTML = '';
      rooms.forEach(room => {
        const div = document.createElement('div');
        div.className = 'room-item' + (room.name === currentRoom ? ' active' : '');
        div.innerHTML = `
          <span class="room-name">${escapeHtml(room.name)}</span>
          <span class="room-count">${room.userCount}</span>
        `;
        div.onclick = () => switchRoom(room.name);
        roomList.appendChild(div);
      });
    }

    function renderUsers(users) {
      userList.innerHTML = '';
      users.forEach(name => {
        const div = document.createElement('div');
        div.className = 'user-item';
        div.textContent = escapeHtml(name) + (name === userName ? ' (you)' : '');
        userList.appendChild(div);
      });
    }

    function switchRoom(roomName) {
      if (roomName === currentRoom) return;
      send({ action: 'switch-room', payload: { room: roomName }, userId });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function scrollToBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    joinBtn.onclick = () => {
      const name = nameInput.value.trim();
      const room = roomSelect.value;
      if (!name) return alert('Please enter a name');
      userName = name;
      send({ action: 'join', payload: { name, room } });
    };

    nameInput.onkeypress = (e) => { if (e.key === 'Enter') joinBtn.click(); };

    sendBtn.onclick = () => {
      const content = messageInput.value.trim();
      if (!content) return;
      send({ action: 'message', payload: { content }, userId });
      messageInput.value = '';
    };

    messageInput.onkeypress = (e) => { if (e.key === 'Enter') sendBtn.click(); };

    connect();
  </script>
</body>
</html>
